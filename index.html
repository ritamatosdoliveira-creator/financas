<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rita & Tiago — Gestão Financeira</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('sw.js')
            .then(function(reg) { console.log('PWA ativa:', reg.scope); })
            .catch(function(err) { console.log('Erro PWA:', err); });
        });
      }
    </script>
</head>
<body>

    <!-- Contentor centralizado que simula o iPhone 17 Pro Max -->
    <div class="iphone-container">
        
        <!-- Barra de Estado Fixa no Topo -->
        <div class="status-bar">
            <span class="time">9:41</span>
            <div class="icons">📶 🔋</div>
        </div>

        <!-- Título do Ecrã -->
        <header>
            <h1>Novo movimento</h1>
        </header>

        <!-- Formulário com os campos do protótipo -->
        <main>
            <form id="movimentoForm">
                <div class="form-group">
                    <label for="descricao">Descrição</label>
                    <input type="text" id="descricao" placeholder="Ex: Supermercado">
                </div>

                <div class="form-group">
                    <label for="data">Data</label>
                    <input type="date" id="data">
                </div>

                <div class="form-group">
                    <label for="valorTotal">Valor total (€)</label>
                    <input type="number" id="valorTotal" step="0.01" placeholder="0,00">
                </div>

                <div class="form-group">
                    <label for="jaPago">Já pago (€)</label>
                    <input type="number" id="jaPago" step="0.01" placeholder="0,00">
                </div>

                <div class="form-group">
                    <label for="categoria">Categoria</label>
                    <select id="categoria">
                        <option value="">Selecione uma categoria</option>
                        <option value="Alimentação">Alimentação</option>
                        <option value="Lazer">Lazer</option>
                        <option value="Transportes">Transportes</option>
                        <option value="Casa">Casa</option>
                    </select>
                </div>
            </form>
        </main>

        <!-- Barra de Ações no Fundo (Conforme o protótipo) -->
        <footer class="action-bar">
            <button class="btn-secondary" onclick="limparFormulario()">Cancelar</button>
            <button class="btn-primary" onclick="guardarMovimento()">Guardar</button>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
